name: Build Windows EXE

# Push a vX.Y.Z tag (or run this workflow by hand) and the EXE lands on the
# release page. Installed copies pick it up through the in-app updater.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v1.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The Firebase web key is public client config, but it stays out of the repo:
      # it is baked into a git-ignored module from the FIREBASE_API_KEY secret.
      - name: Bake the Firebase key
        shell: bash
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then
            echo "::warning::FIREBASE_API_KEY secret is missing; this build will have no Google sign-in."
            exit 0
          fi
          python -c "import os, pathlib; pathlib.Path('src/firebase_key.py').write_text('FIREBASE_API_KEY = ' + repr(os.environ['FIREBASE_API_KEY']) + chr(10), encoding='utf-8'); print('sign-in key baked into the build')"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build the EXE
        run: >
          python -m PyInstaller --clean --noconfirm --noconsole --onefile
          --name StealthInterviewCoPilot --distpath dist --workpath build --specpath .
          --icon assets/stealth_copilot.ico --version-file assets/version_info.txt
          --add-data "assets/stealth_copilot.ico;assets"
          --add-data "assets/stealth_copilot.png;assets"
          --collect-all pyaudiowpatch --collect-all pystray --collect-all faster_whisper
          --collect-all ctranslate2 --collect-all tokenizers --collect-all huggingface_hub
          --collect-all av --collect-all bsdiff4 --exclude-module IPython --exclude-module matplotlib
          --exclude-module pytest --exclude-module nbformat --exclude-module zmq
          --exclude-module pandas --exclude-module scipy --exclude-module tensorflow
          src/main.py

      - name: Check the build
        run: python -c "import os,sys; p='dist/StealthInterviewCoPilot.exe'; print(p, os.path.getsize(p)//1048576, 'MB'); sys.exit(0 if os.path.exists(p) else 1)"

      # The file a visitor downloads should say which build it is. The plain name is
      # uploaded too so builds released before the versioned name keep updating.
      - name: Name the installer with its version
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          Copy-Item "dist/StealthInterviewCoPilot.exe" "dist/StealthInterviewCoPilot-$tag.exe"
          Get-ChildItem "dist/*.exe" | Select-Object Name, Length

      # Only the changed bytes: the app patches itself instead of re-downloading 108 MB.
      - name: Build the delta patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/make_patch.py

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Stealth Co-Pilot ${{ inputs.tag || github.ref_name }}
          files: |
            dist/StealthInterviewCoPilot.exe
            dist/StealthInterviewCoPilot-v*.exe
            dist/*.bsdiff
          generate_release_notes: true
          fail_on_unmatched_files: false
